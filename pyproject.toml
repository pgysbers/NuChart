[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "NuChart"
version = "0.0.1"
description = "Package to automatically generate plots of the nuclear chart. Inspired by Heiko Hergert's Mathematica script"
readme = "README.md"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "PIL",
    "io"
]


[tool.setuptools]
# ...
# By default, include-package-data is true in pyproject.toml,
# so you do NOT have to specify this line.
include-package-data = true

[tool.setuptools.packages.find]
# All the following settings are optional:
where = ["src"]  # ["."] by default
include = ["NuChart*"]  # ["*"] by default
namespaces = false  # true by default

